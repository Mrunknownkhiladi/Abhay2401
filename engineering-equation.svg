<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="Software + IoT + Mechanical + Electrical + Communication = Real-World Technology" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text{font-family:'Courier New',Consolas,monospace;text-anchor:middle}
    .t{font-size:26px;font-weight:700;fill:#e6edf3;letter-spacing:6px}
    .p{font-size:24px;fill:#00f5ff}
    .r{font-size:28px;font-weight:700;fill:url(#g);letter-spacing:4px}
  </style>
  <rect x="2" y="2" width="756" height="466" rx="22" fill="#0d1117" fill-opacity="0.95" stroke="url(#g)" stroke-width="2"/>
  <rect x="2" y="2" width="756" height="466" rx="22" fill="none" stroke="#00f5ff" stroke-width="1" stroke-dasharray="6 14" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g>
    <text x="380" y="62"  class="t">SOFTWARE</text>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.06;0.5;0.95;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g><text x="380" y="98" class="p">+</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.14;0.95;1" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="380" y="140" class="t">IoT</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.18;0.95;1" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="380" y="176" class="p">+</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.26;0.95;1" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="380" y="218" class="t">MECHANICAL</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.3;0.95;1" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="380" y="254" class="p">+</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.38;0.95;1" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="380" y="296" class="t">ELECTRICAL</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.42;0.95;1" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="380" y="332" class="p">+</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.5;0.95;1" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="380" y="374" class="t">COMMUNICATION</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.54;0.95;1" dur="9s" repeatCount="indefinite"/></g>

  <line x1="200" y1="395" x2="560" y2="395" stroke="url(#g)" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.58;0.64;0.95;1" dur="9s" repeatCount="indefinite"/>
  </line>
  <g filter="url(#glow)">
    <text x="380" y="438" class="r">= REAL-WORLD TECHNOLOGY</text>
    <animate attributeName="opacity" values="0;0;1;0.6;1;0.6;1;0" keyTimes="0;0.62;0.7;0.76;0.82;0.88;0.95;1" dur="9s" repeatCount="indefinite"/>
  </g>
</svg>
